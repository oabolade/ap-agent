<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0e1a"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2035" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00ff88"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff8800"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff4466"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#00d4ff" font-size="22" font-weight="bold" filter="url(#glow)" letter-spacing="4">AUTO AP — AUTONOMOUS ACCOUNTS PAYABLE AGENT</text>
  <text x="600" y="62" text-anchor="middle" fill="#4a6080" font-size="11" letter-spacing="6">SYSTEM ARCHITECTURE v1.0 · TINYFISH ACCELERATOR</text>
  <line x1="100" y1="72" x2="1100" y2="72" stroke="#1a3050" stroke-width="1"/>

  <!-- ═══ LAYER 1: INGESTION ═══ -->
  <text x="30" y="115" fill="#4a6080" font-size="10" letter-spacing="3">LAYER 1 · INGESTION</text>
  <line x1="30" y1="120" x2="280" y2="120" stroke="#1a3050" stroke-width="1"/>

  <!-- Vendor Email Box -->
  <rect x="30" y="130" width="160" height="70" rx="4" fill="#0d1525" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="110" y="155" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="bold">VENDOR EMAIL</text>
  <text x="110" y="172" text-anchor="middle" fill="#4a7090" font-size="9">ap@yourco.com</text>
  <text x="110" y="186" text-anchor="middle" fill="#4a7090" font-size="9">invoice PDF / HTML</text>

  <!-- AgentMail Box -->
  <rect x="30" y="230" width="160" height="70" rx="4" fill="#0d1525" stroke="#00ff88" stroke-width="1.5" filter="url(#glow)"/>
  <text x="110" y="255" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">AGENTMAIL</text>
  <text x="110" y="272" text-anchor="middle" fill="#4a9060" font-size="9">inbox monitor</text>
  <text x="110" y="286" text-anchor="middle" fill="#4a9060" font-size="9">webhook trigger</text>

  <!-- Arrow: Vendor → AgentMail -->
  <line x1="110" y1="200" x2="110" y2="228" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="118" y="218" fill="#4a6080" font-size="9">new email</text>

  <!-- ═══ LAYER 2: EXTRACTION ═══ -->
  <text x="230" y="115" fill="#4a6080" font-size="10" letter-spacing="3">LAYER 2 · EXTRACTION</text>
  <line x1="230" y1="120" x2="500" y2="120" stroke="#1a3050" stroke-width="1"/>

  <!-- Fireworks.ai Box -->
  <rect x="240" y="230" width="160" height="70" rx="4" fill="#0d1525" stroke="#ff8800" stroke-width="1.5" filter="url(#glow)"/>
  <text x="320" y="255" text-anchor="middle" fill="#ff8800" font-size="11" font-weight="bold">FIREWORKS.AI</text>
  <text x="320" y="272" text-anchor="middle" fill="#906030" font-size="9">LLM invoice parser</text>
  <text x="320" y="286" text-anchor="middle" fill="#906030" font-size="9">→ structured JSON</text>

  <!-- Arrow: AgentMail → Fireworks -->
  <line x1="190" y1="265" x2="238" y2="265" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="205" y="258" fill="#4a6080" font-size="9">webhook</text>

  <!-- Extracted Data Box -->
  <rect x="240" y="330" width="160" height="90" rx="4" fill="#0a1020" stroke="#ff8800" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="350" text-anchor="middle" fill="#906030" font-size="10" font-weight="bold">EXTRACTED DATA</text>
  <text x="260" y="368" fill="#4a6080" font-size="9">· vendor_name</text>
  <text x="260" y="382" fill="#4a6080" font-size="9">· invoice_number</text>
  <text x="260" y="396" fill="#4a6080" font-size="9">· line_items[]</text>
  <text x="260" y="410" fill="#4a6080" font-size="9">· total_amount · due_date</text>
  <line x1="320" y1="300" x2="320" y2="328" stroke="#ff8800" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ═══ LAYER 3: TINYFISH AGENT ═══ -->
  <text x="450" y="115" fill="#4a6080" font-size="10" letter-spacing="3">LAYER 3 · AGENT EXECUTION</text>
  <line x1="450" y1="120" x2="820" y2="120" stroke="#1a3050" stroke-width="1"/>

  <!-- TinyFish Central Box -->
  <rect x="460" y="160" width="200" height="120" rx="6" fill="#0d1525" stroke="#00d4ff" stroke-width="2" filter="url(#glow-strong)"/>
  <text x="560" y="190" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="bold" letter-spacing="2">TINYFISH</text>
  <text x="560" y="208" text-anchor="middle" fill="#00d4ff" font-size="11">WEB AGENT API</text>
  <line x1="470" y1="215" x2="650" y2="215" stroke="#1a3050" stroke-width="1"/>
  <text x="560" y="233" text-anchor="middle" fill="#4a7090" font-size="9">· browser automation</text>
  <text x="560" y="247" text-anchor="middle" fill="#4a7090" font-size="9">· dynamic UI navigation</text>
  <text x="560" y="261" text-anchor="middle" fill="#4a7090" font-size="9">· state management</text>

  <!-- Arrow: Fireworks → TinyFish -->
  <line x1="400" y1="265" x2="458" y2="220" stroke="#ff8800" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="248" fill="#4a6080" font-size="9">JSON payload</text>

  <!-- QuickBooks Box -->
  <rect x="460" y="320" width="200" height="80" rx="4" fill="#0d1525" stroke="#00ff88" stroke-width="1.5" filter="url(#glow)"/>
  <text x="560" y="348" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">QUICKBOOKS SANDBOX</text>
  <text x="560" y="366" text-anchor="middle" fill="#4a9060" font-size="9">· login + PO lookup</text>
  <text x="560" y="380" text-anchor="middle" fill="#4a9060" font-size="9">· bill creation + payment schedule</text>

  <!-- Arrow: TinyFish → QuickBooks -->
  <line x1="560" y1="280" x2="560" y2="318" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="302" fill="#4a6080" font-size="9">navigate</text>

  <!-- Vendor Portals Box -->
  <rect x="460" y="430" width="200" height="70" rx="4" fill="#0d1525" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="455" text-anchor="middle" fill="#4a7090" font-size="10" font-weight="bold">VENDOR PORTALS</text>
  <text x="560" y="472" text-anchor="middle" fill="#4a6080" font-size="9">Amazon Biz · Utilities</text>
  <text x="560" y="486" text-anchor="middle" fill="#4a6080" font-size="9">SaaS tools (any UI)</text>
  <line x1="560" y1="400" x2="560" y2="428" stroke="#00d4ff" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="568" y="418" fill="#4a6080" font-size="9">optional</text>

  <!-- ═══ LAYER 4: DECISION ═══ -->
  <text x="700" y="115" fill="#4a6080" font-size="10" letter-spacing="3">LAYER 4 · DECISION</text>
  <line x1="700" y1="120" x2="950" y2="120" stroke="#1a3050" stroke-width="1"/>

  <!-- 3-Way Match Diamond -->
  <polygon points="820,310 870,355 820,400 770,355" fill="#0d1525" stroke="#ff8800" stroke-width="1.5" filter="url(#glow)"/>
  <text x="820" y="350" text-anchor="middle" fill="#ff8800" font-size="9" font-weight="bold">3-WAY</text>
  <text x="820" y="364" text-anchor="middle" fill="#ff8800" font-size="9">MATCH</text>

  <!-- Arrow: QuickBooks → Match -->
  <line x1="660" y1="355" x2="768" y2="355" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="685" y="347" fill="#4a6080" font-size="9">PO data</text>

  <!-- PASS path -->
  <line x1="870" y1="355" x2="940" y2="280" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="893" y="308" fill="#00ff88" font-size="9">✓ MATCH</text>

  <!-- FAIL path -->
  <line x1="870" y1="355" x2="940" y2="430" stroke="#ff4466" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="893" y="408" fill="#ff4466" font-size="9">✗ EXCEPTION</text>

  <!-- Auto-approve box -->
  <rect x="942" y="240" width="155" height="70" rx="4" fill="#0d1525" stroke="#00ff88" stroke-width="1.5" filter="url(#glow)"/>
  <text x="1020" y="265" text-anchor="middle" fill="#00ff88" font-size="10" font-weight="bold">AUTO APPROVE</text>
  <text x="1020" y="282" text-anchor="middle" fill="#4a9060" font-size="9">bill created in QB</text>
  <text x="1020" y="296" text-anchor="middle" fill="#4a9060" font-size="9">payment scheduled</text>

  <!-- Exception box -->
  <rect x="942" y="395" width="155" height="70" rx="4" fill="#0d1525" stroke="#ff4466" stroke-width="1.5" filter="url(#glow)"/>
  <text x="1020" y="420" text-anchor="middle" fill="#ff4466" font-size="10" font-weight="bold">FLAG + ALERT</text>
  <text x="1020" y="437" text-anchor="middle" fill="#904050" font-size="9">Slack / email alert</text>
  <text x="1020" y="451" text-anchor="middle" fill="#904050" font-size="9">human review queue</text>

  <!-- ═══ LAYER 5: STORAGE + OBS ═══ -->
  <text x="30" y="560" fill="#4a6080" font-size="10" letter-spacing="3">LAYER 5 · STORAGE · OBSERVABILITY · FRONTEND</text>
  <line x1="30" y1="565" x2="1170" y2="565" stroke="#1a3050" stroke-width="1"/>

  <!-- MongoDB -->
  <rect x="30" y="580" width="160" height="80" rx="4" fill="#0d1525" stroke="#00ff88" stroke-width="1.5" filter="url(#glow)"/>
  <text x="110" y="608" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">MONGODB</text>
  <text x="110" y="625" text-anchor="middle" fill="#4a9060" font-size="9">invoices · PO records</text>
  <text x="110" y="639" text-anchor="middle" fill="#4a9060" font-size="9">approval history</text>
  <text x="110" y="653" text-anchor="middle" fill="#4a9060" font-size="9">audit trail</text>

  <!-- AgentOps -->
  <rect x="230" y="580" width="160" height="80" rx="4" fill="#0d1525" stroke="#ff8800" stroke-width="1.5" filter="url(#glow)"/>
  <text x="310" y="608" text-anchor="middle" fill="#ff8800" font-size="11" font-weight="bold">AGENTOPS</text>
  <text x="310" y="625" text-anchor="middle" fill="#906030" font-size="9">agent step tracing</text>
  <text x="310" y="639" text-anchor="middle" fill="#906030" font-size="9">live replay for demo</text>
  <text x="310" y="653" text-anchor="middle" fill="#906030" font-size="9">error detection</text>

  <!-- Axiom -->
  <rect x="430" y="580" width="160" height="80" rx="4" fill="#0d1525" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="510" y="608" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="bold">AXIOM</text>
  <text x="510" y="625" text-anchor="middle" fill="#4a7090" font-size="9">structured logging</text>
  <text x="510" y="639" text-anchor="middle" fill="#4a7090" font-size="9">pipeline metrics</text>
  <text x="510" y="653" text-anchor="middle" fill="#4a7090" font-size="9">debug overnight builds</text>

  <!-- Vercel Dashboard -->
  <rect x="630" y="580" width="240" height="80" rx="4" fill="#0d1525" stroke="#00d4ff" stroke-width="2" filter="url(#glow-strong)"/>
  <text x="750" y="608" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="bold">V0 BY VERCEL · DASHBOARD</text>
  <text x="750" y="625" text-anchor="middle" fill="#4a7090" font-size="9">invoices processed · pending approvals</text>
  <text x="750" y="639" text-anchor="middle" fill="#4a7090" font-size="9">flagged exceptions · cash flow view</text>
  <text x="750" y="653" text-anchor="middle" fill="#4a7090" font-size="9">real-time pipeline state</text>

  <!-- Alguna (billing) -->
  <rect x="910" y="580" width="160" height="80" rx="4" fill="#0d1525" stroke="#ff8800" stroke-width="1.5" filter="url(#glow)"/>
  <text x="990" y="608" text-anchor="middle" fill="#ff8800" font-size="11" font-weight="bold">ALGUNA</text>
  <text x="990" y="625" text-anchor="middle" fill="#906030" font-size="9">usage-based billing</text>
  <text x="990" y="639" text-anchor="middle" fill="#906030" font-size="9">per invoice processed</text>
  <text x="990" y="653" text-anchor="middle" fill="#906030" font-size="9">monetization layer</text>

  <!-- Connecting lines to bottom layer -->
  <line x1="560" y1="500" x2="110" y2="578" stroke="#1a3050" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="500" x2="310" y2="578" stroke="#1a3050" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="500" x2="510" y2="578" stroke="#1a3050" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="500" x2="750" y2="578" stroke="#1a3050" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1020" y1="465" x2="990" y2="578" stroke="#1a3050" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="1100" y="140" width="90" height="130" rx="4" fill="#0a0e1a" stroke="#1a3050" stroke-width="1"/>
  <text x="1145" y="158" text-anchor="middle" fill="#4a6080" font-size="9" letter-spacing="2">LEGEND</text>
  <line x1="1110" y1="162" x2="1182" y2="162" stroke="#1a3050" stroke-width="1"/>
  <rect x="1110" y="170" width="12" height="8" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="1128" y="179" fill="#4a7090" font-size="9">core</text>
  <rect x="1110" y="186" width="12" height="8" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  <text x="1128" y="195" fill="#4a7090" font-size="9">data</text>
  <rect x="1110" y="202" width="12" height="8" fill="none" stroke="#ff8800" stroke-width="1.5"/>
  <text x="1128" y="211" fill="#4a7090" font-size="9">LLM/obs</text>
  <rect x="1110" y="218" width="12" height="8" fill="none" stroke="#ff4466" stroke-width="1.5"/>
  <text x="1128" y="227" fill="#4a7090" font-size="9">exception</text>
  <line x1="1110" y1="234" x2="1122" y2="234" stroke="#1a3050" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1128" y="238" fill="#4a7090" font-size="9">optional</text>
  <line x1="1110" y1="250" x2="1122" y2="250" stroke="#1a3050" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1128" y="254" fill="#4a7090" font-size="9">internal</text>

  <!-- Footer -->
  <line x1="30" y1="750" x2="1170" y2="750" stroke="#1a3050" stroke-width="1"/>
  <text x="600" y="768" text-anchor="middle" fill="#2a4060" font-size="9" letter-spacing="3">AUTOAP · TINYFISH ACCELERATOR BUILD · TARGET: SMBS 10–200 EMPLOYEES · STACK: TINYFISH · AGENTMAIL · FIREWORKS.AI · MONGODB · AGENTOPS · AXIOM · VERCEL · ALGUNA</text>
</svg>
